<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="CT Investing Capital">
  <defs>
    <linearGradient id="ctGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E3C766"/>
      <stop offset="55%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#A8851B"/>
    </linearGradient>
  </defs>

  <!-- Badge -->
  <rect width="512" height="512" fill="#132E1D"/>

  <g fill="url(#ctGold)">
    <!-- Cornice -->
    <rect x="128" y="78" width="256" height="17" rx="2"/>

    <!-- Arch: outer semicircle minus inner opening -->
    <path d="M150 300 L150 196 A106 106 0 0 1 362 196 L362 300 L320 300 L320 196 A64 64 0 0 0 192 196 L192 300 Z"/>

    <!-- Plinth -->
    <rect x="132" y="306" width="248" height="18" rx="2"/>
    <rect x="118" y="330" width="276" height="20" rx="2"/>
  </g>

  <!-- Wordmark -->
  <text x="256" y="424"
        font-family="Georgia, 'Times New Roman', 'Iowan Old Style', serif"
        font-size="47" letter-spacing="1.5"
        fill="url(#ctGold)" text-anchor="middle">CT INVESTING</text>
  <text x="256" y="472"
        font-family="Georgia, 'Times New Roman', 'Iowan Old Style', serif"
        font-size="47" letter-spacing="1.5"
        fill="url(#ctGold)" text-anchor="middle">CAPITAL</text>
</svg>
