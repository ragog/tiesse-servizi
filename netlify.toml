[build]
  command = "npm run build"
  publish = "dist"

# ============================================================
# 24/11/2026 · tiesse-group.com mostra il sito fatto su Higgsfield
# (tiesse-group.higgsfield.app), deciso da Angelo. Il sito Astro qui sotto
# resta nel repository ma non si vede.
# PER TORNARE AL SITO ASTRO: togliere tutto questo blocco (o git revert).
#
# Vecchi indirizzi: rinvii TEMPORANEI (302) alla pagina piu' vicina, solo per
# quelli che il sito nuovo non ha. Tolti il 24/11 sera /it, /es, concept e
# Longevity: ora li gestisce il sito nuovo.
# force = true: altrimenti i file del sito Astro coprirebbero i rinvii.
# Il pannello /admin va sul suo indirizzo Higgsfield, dove l'accesso funziona.
# ============================================================
[[redirects]]
  from = "/admin"
  to = "https://tiesse-group.higgsfield.app/admin"
  status = 302
  force = true

[[redirects]]
  from = "/admin/*"
  to = "https://tiesse-group.higgsfield.app/admin/:splat"
  status = 302
  force = true

[[redirects]]
  from = "/progetti"
  to = "/tiesse-servizi"
  status = 302
  force = true

[[redirects]]
  from = "/progetti/*"
  to = "/tiesse-servizi"
  status = 302
  force = true

[[redirects]]
  from = "/en/projects"
  to = "/tiesse-servizi"
  status = 302
  force = true

[[redirects]]
